# Local development dependencies for Proofline.
#
# Scope: PostgreSQL only.
#
# Deliberately NOT included:
#   - The FastAPI backend runs on the host so migration/edit/restart cycles
#     stay fast. `docker compose --profile full up` can build it if a
#     containerised backend is wanted.
#   - No MinIO/object-storage container. The default development receipt
#     storage backend is the private local filesystem adapter, which needs no
#     extra service. Set RECEIPT_STORAGE_BACKEND=supabase to exercise the
#     hosted adapter once credentials exist.
#
# Requires Docker Desktop to be running. See docs/development-setup.md.

name: proofline

services:
  postgres:
    image: postgres:18-alpine
    container_name: proofline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: proofline
      POSTGRES_PASSWORD: proofline
      POSTGRES_DB: proofline
      # Deterministic collation so text ordering matches across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Override with POSTGRES_PORT when something already holds 5432 (for
      # example a locally installed PostgreSQL service, which is common on
      # Windows). Set POSTGRES_PORT in .env and use the same port in
      # DATABASE_URL, for example 55432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 images expect a single mount at /var/lib/postgresql; the
      # older /var/lib/postgresql/data mount point is refused by the 18+ entrypoint
      # because it breaks pg_upgrade --link.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofline -d proofline"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    command:
      - postgres
      # Required by the audit_events append-only trigger approach and by
      # case-insensitive lookups if they are ever needed.
      - -c
      - log_min_duration_statement=500

  # Same service with a throwaway volume, for CI and integration tests.
  #   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
  postgres-test:
    profiles: ["test"]
    image: postgres:18-alpine
    container_name: proofline-postgres-test
    environment:
      POSTGRES_USER: proofline
      POSTGRES_PASSWORD: proofline
      POSTGRES_DB: proofline_test
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      # Matches the postgres:18+ data-directory layout used above.
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofline -d proofline_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # Judges' demo stack: the API and the console, against the seeded demo database.
  #
  # PostgreSQL is deliberately NOT duplicated here. The local demo dataset already
  # lives in the `proofline-postgres-data` volume published on the host at
  # ${POSTGRES_PORT:-55432}, and re-seeding a second database for the same
  # demonstration would be a second source of truth that can drift from the one the
  # analytics were verified against. Containers reach it through
  # `host.docker.internal`, which is why no credentials are copied into a second
  # service. Start it with: `docker compose --profile demo up -d --build`.
  #
  # Ports are chosen to avoid the host processes a developer may already be running:
  # 8011 for the API (8000 is commonly taken) and 3000 for the console, which is the
  # URL to open.
  # ---------------------------------------------------------------------------
  api:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: proofline-api
    restart: unless-stopped
    environment:
      APP_ENV: development
      DEMO_MODE: "true"
      AUTH_PROVIDER: demo
      # The host's seeded demo database, reached from inside the container. Local demo
      # only: this is the development credential that already appears in .env.example.
      DATABASE_URL: postgresql+psycopg://proofline:proofline@host.docker.internal:${POSTGRES_PORT:-55432}/proofline
      RECEIPT_STORAGE_BACKEND: local
      RECEIPT_LOCAL_ROOT: /app/.local-storage/receipts
      EXTRACTION_PROVIDER: unavailable
      # The browser loads the console from localhost:3000, so that is the origin the API
      # must allow. A JSON array: the comma-separated form is rejected before the settings
      # splitter runs.
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      LOG_LEVEL: warning
    ports:
      - "8011:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  console:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: apps/console/Dockerfile
      args:
        # Baked in at build time because the BROWSER resolves this URL, not the
        # container network: `localhost:8011` is the API's published host port. Pointing
        # it at the Compose service name would work from the container and fail in the
        # browser, which is the classic Compose frontend mistake this comment exists to
        # prevent.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8011/api/v1
        NEXT_PUBLIC_DEMO_MODE: "true"
        NEXT_PUBLIC_DEMO_ACTOR_ID: 01613bdb-528d-5ff3-979b-ba292d858d77
    container_name: proofline-console
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres-data:
    name: proofline-postgres-data
