# Alembic configuration.
#
# The database URL is intentionally NOT set here. It is read from the
# application settings (DATABASE_URL) inside migrations/env.py so that there is
# exactly one source of database configuration and no credential can ever be
# committed to this file.

[alembic]
script_location = migrations
prepend_sys_path = .
# Explicit so Alembic does not fall back to legacy space/comma splitting.
path_separator = os
version_path_separator = os
# Timestamped revision filenames keep migrations ordered and reviewable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
